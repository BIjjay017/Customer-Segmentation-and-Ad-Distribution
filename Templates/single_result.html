{% extends "base.html" %}

{% block title %}Single Result{% endblock %}

{% block content %}
	<section class="card stack-md">
		<div class="card-body">
			<h2 class="card-title">Single Input Result</h2>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>Email</th>
							<th>Status</th>
							<th>Cluster</th>
						</tr>
					</thead>
					<tbody>
						{% for row in results %}
							<tr>
								<td>{{ row.email }}</td>
								<td class="{{ 'status-success' if '✅' in row.status else 'status-fail' }}">{{ row.status }}</td>
								<td>{{ row.cluster if row.cluster else '-' }}</td>
							</tr>
						{% endfor %}
					</tbody>
				</table>
			</div>

			<div class="back-link">
				<a href="{{ url_for('single_input') }}">Back to Single Input</a>
			</div>
		</div>
	</section>
{% endblock %}
