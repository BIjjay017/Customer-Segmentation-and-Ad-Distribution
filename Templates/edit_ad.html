{% extends "base.html" %}

{% block title %}Edit Ad{% endblock %}

{% block content %}
  <section class="card">
    <div class="card-body stack-md">
      <h2 class="card-title">Edit Ad #{{ ad.id }}</h2>

      <form method="POST" enctype="multipart/form-data" class="form-grid">
        <div class="form-group">
          <label for="cluster_id">Cluster ID</label>
          <input id="cluster_id" type="number" name="cluster_id" value="{{ ad.cluster }}" required>
        </div>

        <div class="form-group">
          <label for="ad_text">Ad Text</label>
          <textarea id="ad_text" name="ad_text" rows="4" required>{{ ad.ad_text }}</textarea>
        </div>

        <div class="form-group">
          <label for="image_file">Upload New Image (Optional)</label>
          <div class="file-drop">
            <div class="muted">Choose an image file</div>
            <input id="image_file" type="file" name="image_file" accept="image/*">
          </div>

          {% if ad.image_url %}
            <div class="file-info">
              Current image:
              <a href="{{ ad.image_url }}" target="_blank" rel="noopener">Open</a>
            </div>
          {% endif %}
        </div>

        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
      </form>

      <div class="back-link">
        <a href="{{ url_for('ads_management') }}">Back to Ads Management</a>
      </div>
    </div>
  </section>
{% endblock %}
