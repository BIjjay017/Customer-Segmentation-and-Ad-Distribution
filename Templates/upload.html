{% extends "base.html" %}

{% block title %}Bulk Upload{% endblock %}

{% block content %}
    <section class="card">
        <div class="card-body stack-md">
            <h2 class="card-title">Upload Customer Data</h2>

            <form method="POST" action="{{ url_for('bulk_input') }}" enctype="multipart/form-data" class="stack-md" id="uploadForm">
                <div class="file-drop" id="fileUploadArea">
                    <div class="icon" style="font-size: 2rem;">📄</div>
                    <div>Choose a file or drag and drop</div>
                    <div class="muted">Supported: .csv, .xls, .xlsx</div>
                    <input type="file" name="file" accept=".csv,.xls,.xlsx" required id="fileInput">
                </div>

                <div class="file-info" id="fileInfo"></div>

                <div class="actions-row">
                    <button type="button" class="btn" id="selectFileBtn">Select File</button>
                    <button type="submit" class="btn btn-primary" id="uploadButton" disabled>Upload and Predict</button>
                </div>
            </form>

            <div class="back-link">
                <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
            </div>
        </div>
    </section>
{% endblock %}

{% block scripts %}
    <script>
        const fileInput = document.getElementById("fileInput");
        const fileUploadArea = document.getElementById("fileUploadArea");
        const fileInfo = document.getElementById("fileInfo");
        const uploadButton = document.getElementById("uploadButton");
        const selectFileBtn = document.getElementById("selectFileBtn");

        selectFileBtn.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (file) {
                showFileInfo(file);
            }
        });

        fileUploadArea.addEventListener("dragover", (event) => {
            event.preventDefault();
            fileUploadArea.classList.add("dragover");
        });

        fileUploadArea.addEventListener("dragleave", (event) => {
            event.preventDefault();
            fileUploadArea.classList.remove("dragover");
        });

        fileUploadArea.addEventListener("drop", (event) => {
            event.preventDefault();
            fileUploadArea.classList.remove("dragover");
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (isValidFile(file)) {
                    fileInput.files = files;
                    showFileInfo(file);
                }
            }
        });

        function isValidFile(file) {
            return (
                file.name.endsWith(".csv") ||
                file.name.endsWith(".xls") ||
                file.name.endsWith(".xlsx")
            );
        }

        function showFileInfo(file) {
            fileInfo.textContent = `Selected: ${file.name} (${formatFileSize(file.size)})`;
            uploadButton.disabled = false;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return "0 Bytes";
            const k = 1024;
            const sizes = ["Bytes", "KB", "MB", "GB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
        }
    </script>
{% endblock %}
